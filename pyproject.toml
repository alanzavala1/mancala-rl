[project]
name = "mancala-rl"
version = "0.1.0"
description = "An AlphaZero-style self-play agent for the solved game Kalah."
requires-python = ">=3.9"
dependencies = ["numpy", "torch", "matplotlib"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mancala_rl"]
